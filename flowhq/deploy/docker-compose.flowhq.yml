# Adds FLOW HQ to the stack (Caddy -> n8n, Grist). scripts/deploy.sh does this for you once flowhq/.env and flowhq/config/users.json exist.
# By hand, from the repository root:
#   docker compose -f docker-compose.yml -f flowhq/deploy/docker-compose.flowhq.yml up -d --build
# FLOW HQ talks to Grist over the private Docker network; only Caddy is public. See flowhq/README.md (H).
services:
  flowhq:
    build:
      context: .
      dockerfile: flowhq/Dockerfile
    restart: unless-stopped
    env_file: flowhq/.env
    environment:
      - GRIST_BASE_URL=http://grist:8484
      - FLOWHQ_SECURE_COOKIES=true
      - FLOWHQ_USERS_FILE=/app/flowhq/users.json
      - FLOWHQ_CLINIC_FILE=/app/flowhq/clinic.json
    volumes:
      - flowhq_config:/app/flowhq/config                          # workspace profiles written by Settings
      - ./flowhq/config/users.json:/app/flowhq/users.json:ro      # create it first (README H); never committed
      - ./flowhq/config/clinic.json:/app/flowhq/clinic.json:ro    # clinic letterhead + invoice rules (README L); public details, no secrets
    depends_on:
      - grist
    mem_limit: ${FLOWHQ_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  flowhq_config:

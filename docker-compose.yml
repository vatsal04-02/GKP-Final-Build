# Clinic Autopilot: the backend stack (n8n + Grist behind Caddy; FlowHQ is added by flowhq/deploy/docker-compose.flowhq.yml)
# Usage on a server:  cp .env.example .env  ->  ./scripts/gen-secrets.sh  ->  edit .env  ->  ./scripts/deploy.sh   (docs/DEPLOY_HOSTINGER.md)
# Only Caddy is published to the internet. n8n and Grist sit on the private Docker network; the n8n editor is reachable only from ADMIN_ALLOW_CIDR.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" } # rotated: logs can never fill the disk

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
      - N8N_EXTRA_WEBHOOK_PATH=${N8N_EXTRA_WEBHOOK_PATH:-/__disabled__}
      - N8N_ADMIN_DOMAIN=${N8N_ADMIN_DOMAIN:-admin.localhost}
      - ADMIN_ALLOW_CIDR=${ADMIN_ALLOW_CIDR:-127.0.0.1/32}
      - GRIST_DOMAIN=${GRIST_DOMAIN}
      - FLOWHQ_DOMAIN=${FLOWHQ_DOMAIN:-flowhq.localhost}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - grist
    logging: *logging

  n8n:
    # The workflow was tested against n8n 2.43.5 (n8n/production/TEST_REPORT.md). Change the version only after re-testing.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.43.5}
    restart: unless-stopped
    mem_limit: ${N8N_MEM_LIMIT:-2g}
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${N8N_ADMIN_DOMAIN:-admin.localhost}/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_PAYLOAD_SIZE_MAX=4
      - N8N_LOG_LEVEL=info
      # Executions hold patient phone numbers and message text: keep failures only, 7 days, at most 5000
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      # The workflow never runs shell commands or touches local files: those nodes are switched off
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]
      # --- FlowHQ workflow settings: read in the workflow as $env.FLOWHQ_*  (values come from .env)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false  # required so Code/expression nodes can read $env.FLOWHQ_*
      - FLOWHQ_GRIST_URL=${FLOWHQ_GRIST_URL:-http://grist:8484}
      - FLOWHQ_REGISTRY_DOC_ID=${FLOWHQ_REGISTRY_DOC_ID:-}
      - FLOWHQ_DEFAULT_COUNTRY_CODE=${FLOWHQ_DEFAULT_COUNTRY_CODE:-91}
      - FLOWHQ_WA_SEND_MODE=${FLOWHQ_WA_SEND_MODE:-off}
      - FLOWHQ_WA_ALLOWLIST=${FLOWHQ_WA_ALLOWLIST:-}
      - FLOWHQ_WA_GRAPH_VERSION=${FLOWHQ_WA_GRAPH_VERSION:-v23.0}
      - FLOWHQ_WA_TEMPLATE_LANGUAGE=${FLOWHQ_WA_TEMPLATE_LANGUAGE:-en}
      - FLOWHQ_WA_ALLOW_HELLO_WORLD=${FLOWHQ_WA_ALLOW_HELLO_WORLD:-false}
      - FLOWHQ_META_APP_SECRET=${FLOWHQ_META_APP_SECRET:-}
      - FLOWHQ_META_VERIFY_TOKEN=${FLOWHQ_META_VERIFY_TOKEN:-}
      - FLOWHQ_W2_IMPLIED_CONSENT=${FLOWHQ_W2_IMPLIED_CONSENT:-true}
      - FLOWHQ_W1_REQUIRE_CONSENT=${FLOWHQ_W1_REQUIRE_CONSENT:-true}
      - FLOWHQ_CAL_WEBHOOK_SECRET=${FLOWHQ_CAL_WEBHOOK_SECRET:-}
      - FLOWHQ_CAL_MAX_AGE_HOURS=${FLOWHQ_CAL_MAX_AGE_HOURS:-24}
      - FLOWHQ_TELEGRAM_CHAT_ID=${FLOWHQ_TELEGRAM_CHAT_ID:-}
      - FLOWHQ_TEST_PHONE=${FLOWHQ_TEST_PHONE:-}
      - FLOWHQ_ALERT_EMAIL_TO=${FLOWHQ_ALERT_EMAIL_TO:-}
      - FLOWHQ_EMAIL_FROM=${FLOWHQ_EMAIL_FROM:-}
      - FLOWHQ_EMAIL_PATIENT_ACK=${FLOWHQ_EMAIL_PATIENT_ACK:-false}
      # AI: only the switch, model and rate limit are passed. FLOWHQ_AI_BASE_URL is deliberately NOT passed (the workflow defaults to OpenRouter); the key lives in an n8n credential.
      - FLOWHQ_AI_EXTERNAL_ENABLED=${FLOWHQ_AI_EXTERNAL_ENABLED:-false}
      - FLOWHQ_AI_MODEL=${FLOWHQ_AI_MODEL:-openai/gpt-4o-mini}
      - FLOWHQ_AI_MAX_REPLIES_PER_HOUR=${FLOWHQ_AI_MAX_REPLIES_PER_HOUR:-6}   # with AI booking each booking / change costs 2 replies: set 12 BEFORE switching AI booking on (docs/n8n-4c-changes.md)
      # Slice 4C (docs/n8n-4c-changes.md): where W13 reaches the FLOW HQ booking API, over the PRIVATE Docker network (http://flowhq:8787), never the public address.
      # Empty (the default) = W13 offers and books nothing through the CRM. The token is the n8n credential "FlowHQ Booking API", not a variable.
      - FLOWHQ_BOOKING_API_URL=${FLOWHQ_BOOKING_API_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  grist:
    image: gristlabs/grist:${GRIST_VERSION:-1.7.20}
    restart: unless-stopped
    mem_limit: ${GRIST_MEM_LIMIT:-1g}
    environment:
      - APP_HOME_URL=https://${GRIST_DOMAIN}
      - GRIST_SESSION_SECRET=${GRIST_SESSION_SECRET}
      - GRIST_DEFAULT_EMAIL=${GRIST_ADMIN_EMAIL}
      - GRIST_SINGLE_ORG=${GRIST_TEAM_NAME}
      - GRIST_FORCE_LOGIN=true
      - GRIST_SANDBOX_FLAVOR=${GRIST_SANDBOX_FLAVOR:-gvisor}
      # Google sign-in (OIDC). Redirect URI to register in Google Cloud:
      #   https://<GRIST_DOMAIN>/oauth2/callback
      - GRIST_OIDC_IDP_ISSUER=https://accounts.google.com
      - GRIST_OIDC_IDP_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GRIST_OIDC_IDP_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GRIST_OIDC_IDP_SCOPES=openid email profile
    # If formulas fail to run with the gvisor sandbox on your host, uncomment:
    # cap_add:
    #   - SYS_PTRACE
    volumes:
      - grist_data:/persist
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8484/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  grist_data:
